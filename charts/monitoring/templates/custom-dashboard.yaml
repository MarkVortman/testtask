apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-spam-dashboards
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  spam2000-dashboard.json: |
    {
      "title": "Spam2000 Metrics",
      "panels": [
        {
          "type": "graph",
          "title": "Requests Total",
          "targets": [
            {
              "expr": "spam2000_requests_total",
              "legendFormat": "{{instance}}"
            }
          ]
        },
        {
          "type": "graph",
          "title": "Errors Total",
          "targets": [
            {
              "expr": "spam2000_errors_total",
              "legendFormat": "{{instance}}"
            }
          ]
        }
      ],
      "schemaVersion": 16,
      "version": 0
    }
